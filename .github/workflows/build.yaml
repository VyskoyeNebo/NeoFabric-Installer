name: Build NeoFabric Installer

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check release branding
        run: python3 .github/scripts/check-branding.py
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/wrapper-validation@v3
      - name: Download and verify released Loader test fixture
        run: |
          mkdir -p build/test-fixtures
          curl --fail --location --retry 2 https://github.com/VyskoyeNebo/NeoFabric/releases/download/v1.2.0/neofabric-loader-1.2.0.jar --output build/test-fixtures/neofabric-loader-1.2.0.jar
          echo 'b6c5d9d1f27fc0da250fc96a5095ac68cedb99bf46d6bd45206e0dcb60171f23  build/test-fixtures/neofabric-loader-1.2.0.jar' | sha256sum --check --strict
      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace --max-workers=2
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NeoFabric-Installer-test-reports
          path: |
            build/test-results/
            build/reports/tests/
          if-no-files-found: ignore
      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: NeoFabric-Installer
          path: |
            build/libs/*.jar
            build/libs/*.exe
          if-no-files-found: error
