pluginManagement {
	repositories {
		maven {
			url = 'https://maven.aliyun.com/repository/gradle-plugin'
			content { excludeGroupByRegex 'net\\.fabricmc(\\..*)?' }
		}
		maven {
			url = 'https://maven.aliyun.com/repository/public'
			content { excludeGroupByRegex 'net\\.fabricmc(\\..*)?' }
		}
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

rootProject.name = 'neofabric-installer'

